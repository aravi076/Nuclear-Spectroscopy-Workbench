# Tests, lint, types, dependency audit and the synthetic validation run (R6).
#
# Security choices (docs/engineering/ENGINEERING_TOOLING_AUDIT.md section 6):
# - read-only token; no secrets are used, so pull requests from forks get nothing;
# - `pull_request`, never `pull_request_target`;
# - third-party actions pinned to full commit SHAs (tag in the comment); Dependabot
#   proposes updates as pull requests that must pass this workflow;
# - dependencies installed exactly from uv.lock (`--locked` fails if it is stale);
# - no laboratory data exist in the repository; tests that need them skip.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} (${{ matrix.tests }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest  # the platform NSW is built for
            python: "3.12"
            tests: 'not experimental'
          - os: ubuntu-latest
            python: "3.12"
            tests: 'not experimental'
          # declared minimum Python version: calculation engine only. The desktop
          # interface needs 3.12 (PySide6 6.12 aborts Python 3.11 with 'none_dealloc').
          - os: ubuntu-latest
            python: "3.11"
            tests: 'not experimental and not gui'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.7"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Qt runtime libraries (Linux, offscreen platform)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install from the lock file
        run: uv sync --locked --all-extras

      - name: Lint and format
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts

      - name: Types
        run: uv run --no-sync mypy

      - name: Tests
        run: uv run --no-sync pytest -m "${{ matrix.tests }}" --cov --cov-report=term

      - name: Dependency audit
        run: uv run --no-sync pip-audit --skip-editable

      - name: Generic secret and path scan of the checkout
        # private patterns live only on the owner's machine; here the generic ones run
        run: uv run --no-sync python scripts/release/scan_public_copy.py . --no-private

      - name: Synthetic validation run with repeatability
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/validation/run_validation.py --trials 1000 --repeat --out validation-run

      - name: Keep the validation tables
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: validation-run
          path: validation-run
          retention-days: 30
