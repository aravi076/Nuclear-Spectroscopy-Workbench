[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nsw"
version = "0.1.0a1"
description = "Nuclear Spectroscopy Workbench: gamma-ray spectroscopy analysis for HPGe and NaI(Tl) detectors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Desktop interface and figures. Kept optional so the scientific engine installs
# and tests without Qt. PySide6-Essentials is the QtCore/QtGui/QtWidgets subset of
# PySide6 (same bindings, ~1/3 of the disk footprint); see TECHNICAL_DECISIONS.md TD-004.
gui = [
    "PySide6-Essentials>=6.7",
    "pyqtgraph>=0.13.7",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
]
package = ["pyinstaller>=6.10"]

[project.gui-scripts]
nsw = "nsw.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nsw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "experimental: needs the local read-only laboratory dataset (skipped when not configured)",
    "gui: needs a Qt platform (offscreen is fine)",
    "slow: long-running validation",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
# Scientific text legitimately uses Greek letters and typographic maths symbols.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["nsw"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["nsw"]
omit = ["src/nsw/ui/*"]

[tool.ruff.lint.isort]
known-first-party = ["nsw", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyqtgraph.*"]
ignore_missing_imports = true
